<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2d2926" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Minha Área" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Favicon: a marca oficial da escola (pedido da Erica, 11/09/2026). O app-icon.svg continua
         sendo o ícone do app "Minha Área" (manifest e apple-touch-icon) — são coisas diferentes:
         um é a aba do navegador, o outro é o atalho instalado no celular da aluna. -->
    <link rel="icon" href="/assets/marca/favicon-ebn.svg" type="image/svg+xml" />
    <link rel="icon" href="/assets/marca/favicon-ebn-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/marca/apple-touch-icon.png" />
    <meta name="robots" content="noindex,nofollow" />
    <!-- Verificação de domínio da Meta: cole aqui a tag do Gerenciador de Negócios DESTA escola.
         Atenção ao alcance: a tag verifica exatamente o domínio que serve este HTML. Se a agenda
         roda num subdomínio e o site institucional em outro servidor, o domínio raiz continua
         precisando da própria verificação, por DNS.
    <meta name="facebook-domain-verification" content="" /> -->
    <title>Agenda a escola — Matrículas</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
